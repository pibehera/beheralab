  <g id="device-transition" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- The ordered lattice progressively sheds nodes and resolves into device geometry. -->
    <path d="M220 510H460" stroke="#c3c3c3" stroke-width="1"/>
    <path d="M244 510V526M292 510V526M340 510V544M388 510V526M436 510V526" stroke="#c8c8c8" stroke-width="1"/>
    <path d="M244 526H436" stroke="#bcbcbc" stroke-width="1.1"/>
    <path d="M292 526V542M388 526V542M292 542H388" stroke="#a8a8a8" stroke-width="1.2"/>
